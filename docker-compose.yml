services:
  # Microsoft SQL Server Database Engine
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: accounting_erp_sql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  # ASP.NET Core Web API (.NET 10)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: accounting_erp_backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AccountingERP_Db;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;MultipleActiveResultSets=true;"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - erp_network

  # Angular 21+ Frontend UI (Nginx)
  frontend:
    build:
      context: ./Frontend/accounting-erp-ui
      dockerfile: Dockerfile
    container_name: accounting_erp_frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
